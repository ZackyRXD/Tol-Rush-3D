<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tol Rush 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14122b; --panel:rgba(20,18,43,.84); --cream:#fff4e2;
  --teal:#19e0c8; --gold:#ffc933; --pink:#ff3d8b;
  --font-d:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{margin:0;height:100%;background:#14122b;overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-b);color:var(--cream)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#nitroFx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at 50% 62%,transparent 38%,rgba(255,61,139,.5) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#hud .tl{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 10px);line-height:1}
#sc{font-family:var(--font-d);font-size:clamp(38px,9vw,54px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#hud small{display:block;font-weight:800;font-size:13px;opacity:.85;margin-top:2px}
#hud .tr{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.coins{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 14px 6px 8px;border-radius:999px;font-family:var(--font-d);font-size:24px}
.coins i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#c98a00);box-shadow:inset 0 0 0 3px #e0a400}
#mute,#pausebtn,#camBtn{pointer-events:auto;background:var(--panel);color:var(--cream);border:0;border-radius:999px;padding:6px 12px;font:800 13px var(--font-b);cursor:pointer}
#pausebtn{display:none}
#pausebtn.on{display:block}
#buffhud{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);width:min(46vw,260px);text-align:center;opacity:0;transition:opacity .2s}
#buffhud.on{opacity:1}
#shieldhud{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);font:400 15px var(--font-d);padding:5px 12px;border-radius:999px;background:var(--panel);color:#5bd6ff;box-shadow:0 0 0 2px rgba(91,214,255,.5);opacity:0;transition:opacity .2s;pointer-events:none}
#shieldhud.on{opacity:1}#shieldhud.cd{color:#9aa0b4;box-shadow:0 0 0 2px rgba(255,244,226,.18)}
#bname{font-family:var(--font-d);font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.bbar{height:9px;border-radius:6px;background:rgba(20,18,43,.8);overflow:hidden;margin-top:4px;box-shadow:0 0 0 2px rgba(255,244,226,.18)}
#bfill{height:100%;width:100%;background:var(--teal)}
#pick,#pausescr{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box;background:rgba(14,12,36,.7);overflow:auto}
#pick.hide,#pausescr.hide{display:none}
#pick h2{font-family:var(--font-d);font-weight:400;font-size:clamp(34px,8vw,52px);margin:0;text-shadow:3px 3px 0 var(--pink);line-height:1}
#pick p{margin:0;font-weight:800;font-size:14px;opacity:.8}
.buffs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:780px}
.bcard{--c:var(--teal);width:224px;background:var(--panel);color:var(--cream);border:2px solid var(--c);border-radius:18px;padding:18px 14px 16px;cursor:pointer;font-family:var(--font-b);text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .12s}
.bcard:hover{transform:translateY(-3px)}
.bcard:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.bcard svg{width:46px;height:46px;fill:var(--c)}
.bcard b{display:block;font-family:var(--font-d);font-weight:400;font-size:26px;color:var(--c);margin:6px 0 4px}
.bcard span{display:block;font-size:13.5px;line-height:1.4}
.bcard em{display:block;font-style:normal;font-weight:800;font-size:12.5px;opacity:.7;margin-top:8px}
@media(max-width:560px){.bcard{width:100%;max-width:340px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr;gap:0 12px;text-align:left;align-items:center}.bcard svg{grid-row:1/4}.bcard b{margin:0}.bcard em{margin-top:2px}}
.btn2{background:transparent;color:var(--cream);border:2px solid rgba(255,244,226,.35);border-radius:14px;padding:11px 28px;font:400 20px var(--font-d);cursor:pointer}
.row{display:flex;flex-direction:column;gap:12px;align-items:center}
#hud .bl{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);line-height:1}
#kmh{font-family:var(--font-d);font-size:clamp(34px,8vw,46px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#hud .bc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(40vw,300px)}
.nbar{height:14px;border-radius:9px;background:rgba(20,18,43,.8);overflow:hidden;box-shadow:0 0 0 2px rgba(255,244,226,.18)}
#nfill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold))}
#nlabel{display:block;text-align:center;font-weight:800;font-size:13px;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#nbtn{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:86px;height:86px;border-radius:50%;border:0;
  background:var(--pink);color:#fff;font:400 20px var(--font-d);box-shadow:0 6px 0 #a3185a;opacity:.25;transform:scale(.9);transition:.2s;pointer-events:none}
#nbtn.ready{opacity:1;transform:scale(1);pointer-events:auto;animation:pulse .7s infinite alternate}
#nbtn.ready:active{transform:translateY(4px);box-shadow:0 2px 0 #a3185a}
@keyframes pulse{to{box-shadow:0 6px 0 #a3185a,0 0 28px 6px rgba(255,61,139,.65)}}
#pops{position:fixed;left:0;right:0;top:26%;pointer-events:none;text-align:center}
.pop{font-family:var(--font-d);font-size:clamp(24px,6vw,34px);text-shadow:0 3px 0 rgba(0,0,0,.45);animation:rise .9s ease-out forwards;position:absolute;left:0;right:0}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.05)}to{opacity:0;transform:translateY(-34px)}}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:rgba(14,12,36,.4)}
#screen.hide{display:none}
.card{max-height:100%;overflow:auto;max-width:430px;width:100%;background:var(--panel);border-radius:22px;padding:28px 26px;border:2px solid rgba(255,244,226,.14);text-align:center}
.card h1{font-family:var(--font-d);font-weight:400;font-size:clamp(46px,12vw,66px);margin:0 0 8px;line-height:1;text-shadow:3px 3px 0 var(--pink)}
.card p{margin:0 0 16px;line-height:1.5;font-size:16px}
.keys{text-align:left;font-size:14.5px;line-height:1.45;margin:0 0 20px;display:grid;gap:10px}
.keys b{color:var(--teal)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 20px}
.stats div{background:rgba(255,244,226,.08);border-radius:12px;padding:10px}
.stats b{display:block;font-family:var(--font-d);font-weight:400;font-size:28px}
.stats span{font-size:13px;opacity:.8}
#go{background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:13px 34px;font:400 24px var(--font-d);cursor:pointer;box-shadow:0 5px 0 #b8870a}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #b8870a}
#best{margin-top:14px;font-weight:800;font-size:14px;opacity:.85}
.card.wide{max-width:560px}
.card.over{overflow:hidden;padding:16px 20px;touch-action:none;overscroll-behavior:none}
.card.over h1{font-size:clamp(34px,9vw,48px);margin-bottom:4px}
.card.over .stats{gap:6px;margin:4px 0 10px}
.card.over .stats div{padding:6px}
.card.over .stats b{font-size:22px}
.card.over .stats span{font-size:12px}
.card.over .menubtns{gap:8px;margin:10px 0 2px}
.card.over .mbtn,.card.over .mbtn.play{font-size:20px;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card.over .mbtn.play{box-shadow:0 4px 0 #b8870a}.card.over .mbtn.tut{box-shadow:0 4px 0 #0d9c8b}.card.over .mbtn.shop{box-shadow:0 4px 0 #a3185a}
.card.over .wallet{font-size:18px;padding:3px 12px 3px 6px}
.menubtns{display:grid;gap:12px;margin:18px 0 6px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:16px;padding:14px 24px;font:400 26px var(--font-d);cursor:pointer;color:var(--ink);transition:transform .1s}
.mbtn svg{width:26px;height:26px;fill:currentColor}
.mbtn.play{background:var(--gold);box-shadow:0 6px 0 #b8870a;font-size:32px;padding:18px 24px}
.mbtn.tut{background:var(--teal);box-shadow:0 6px 0 #0d9c8b}
.mbtn.shop{background:var(--pink);color:#fff;box-shadow:0 6px 0 #a3185a}
.mbtn:active{transform:translateY(5px)}
.mbtn.play:active{box-shadow:0 1px 0 #b8870a}.mbtn.tut:active{box-shadow:0 1px 0 #0d9c8b}.mbtn.shop:active{box-shadow:0 1px 0 #a3185a}
.wallet{display:inline-flex;align-items:center;gap:8px;background:rgba(255,244,226,.1);border-radius:999px;padding:5px 14px 5px 7px;font:400 22px var(--font-d)}
.wallet i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#c98a00);box-shadow:inset 0 0 0 3px #e0a400}
.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sub h2{font-family:var(--font-d);font-weight:400;font-size:34px;margin:0;text-shadow:2px 2px 0 var(--pink)}
.back{background:transparent;color:var(--cream);border:2px solid rgba(255,244,226,.35);border-radius:12px;padding:7px 16px;font:400 18px var(--font-d);cursor:pointer}
.card.tut{scrollbar-width:none;-ms-overflow-style:none}
.card.tut::-webkit-scrollbar{display:none;width:0;height:0}
.tgrid{display:grid;gap:10px;text-align:left}
.tcard{background:rgba(255,244,226,.07);border-radius:12px;padding:12px 14px}
.tcard h3{margin:0 0 6px;font:400 21px var(--font-d);color:var(--c,var(--teal))}
.tcard ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.tcard li b{color:var(--gold)}
.tcard code{background:rgba(0,0,0,.35);border-radius:5px;padding:1px 6px;font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{background:rgba(255,244,226,.07);border:2px solid transparent;border-radius:16px;padding:12px 10px 12px}
.scard.sel{border-color:var(--teal)}
.swatch{height:64px;border-radius:12px;margin-bottom:8px;position:relative;box-shadow:inset 0 -14px 22px rgba(0,0,0,.35),inset 0 8px 12px rgba(255,255,255,.28)}
.swatch:after{content:"";position:absolute;left:18%;right:18%;top:10px;height:16px;border-radius:8px 8px 4px 4px;background:rgba(20,30,50,.55)}
.scard b{display:block;font:400 22px var(--font-d)}
.scard button{margin-top:8px;width:100%;border:0;border-radius:11px;padding:9px;font:400 18px var(--font-d);cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b8870a}
.scard button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8870a}
.scard button.use{background:var(--teal);box-shadow:0 4px 0 #0d9c8b}
.scard button.on{background:transparent;color:var(--teal);box-shadow:none;border:2px solid var(--teal);cursor:default}
.cartile{height:64px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -10px 18px rgba(0,0,0,.3)}
.cnote{margin:2px 0 0;font-size:12.5px;opacity:.85;min-height:32px}
.sec{grid-column:1/-1;font:400 17px var(--font-d);color:var(--gold);margin-top:4px}
.scard button.poor{background:#555;color:#bbb;box-shadow:0 4px 0 #333}
.msg{min-height:20px;font-weight:800;font-size:14px;margin:12px 0 0;color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nitroFx"></div>

<div id="hud">
  <div class="tl"><span id="sc">0</span><small>poin</small><small id="bnext"></small></div>
  <div class="tr">
    <div class="coins"><i></i><span id="cn">0</span></div>
    <button id="pausebtn" type="button">Jeda</button>
    <button id="camBtn" type="button">Kamera: Belakang</button>
    <button id="mute" type="button">Suara: nyala</button>
  </div>
  <div class="bl"><span id="kmh">0</span><small>km/jam</small></div>
  <div class="bc"><div class="nbar"><div id="nfill"></div></div><span id="nlabel">Nitro</span></div>
  <button id="nbtn" type="button">NITRO</button>
</div>
<div id="buffhud"><div id="bname"></div><div class="bbar"><div id="bfill"></div></div></div>
<div id="shieldhud"></div>
<div id="pops"></div>

<div id="pausescr" class="hide">
  <div class="card">
    <h1>Jeda</h1>
    <div class="row"><button id="go2" type="button" style="background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:13px 34px;font:400 24px var(--font-d);cursor:pointer;box-shadow:0 5px 0 #b8870a">Lanjutkan</button>
    <button id="restartbtn" class="btn2" type="button">Mulai ulang</button></div>
    <div id="best" style="margin-top:14px">Tekan P atau Esc untuk lanjut</div>
  </div>
</div>
<div id="screen">
  <div class="card" id="card"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const lerp = (a,b,t) => a + (b-a)*t;
const LANES = 4, LW = 3.4, HALF = LANES*LW/2, SPAWN = 220;
const laneX = i => (i - (LANES-1)/2) * LW;
const laneSpeed = [8, 12, 16, 20];
const NITRO_DUR = 5;

/* =====================
   MAP / BIOME DEFINITIONS
   ===================== */
const MAPS = {
  classic: {
    id:'classic', name:'Tol Rush 3D', price:0, css:'#19e0c8',
    biomeNames:['Zona Hutan','Desa & Pantai','Kota Metropolis'],
    biomeSigns:['ZONA HUTAN','DESA & PANTAI','KOTA METROPOLIS'],
    fog:0x7fae8f, ground:0x4d8a45, skyStops:['#3a86cf','#5fa8dd','#8fc5e8','#a9d3ea','#7fae8f'],
    hills:[{r:395,cols:[0x5a9c80,0x64a68a],h:[120,190],n:12},{r:345,cols:[0x3f7d62,0x478868,0x3a7459],h:[70,130],n:16}],
    gantryBg:'#0f6b4a', gantryFg:'#ffffff',
    cycle:42, split:[10,26]
  },
  sahara: {
    id:'sahara', name:'Tol Rush 3D - Sahara', price:1000, css:'#ffc933',
    biomeNames:['Gurun Pasir','Oasis & Kasbah','Lembah Piramida'],
    biomeSigns:['GURUN PASIR','OASIS & KASBAH','LEMBAH PIRAMIDA'],
    fog:0xeed3a2, ground:0xe0b878, skyStops:['#2f7cc8','#58a3dc','#a8d2ea','#eed3a2','#eed3a2'],
    hills:[{r:395,cols:[0xe6c48e,0xebcb98],h:[80,140],n:12},{r:345,cols:[0xd9b278,0xdfba82,0xd2a86e],h:[45,95],n:16}],
    gantryBg:'#a8561f', gantryFg:'#fff1d0',
    cycle:42, split:[10,26]
  },
  china: {
    id:'china', name:'Tol Rush 3D - Tiongkok', price:1000, css:'#e8281e',
    biomeNames:['Sawah & Bambu','Kota Lentera','Pegunungan Karst'],
    biomeSigns:['SAWAH & BAMBU','KOTA LENTERA','GUNUNG KARST'],
    fog:0xdbe7e1, ground:0x84b256, skyStops:['#2f7cc8','#58a3dc','#a8d2ea','#dbe7e1','#dbe7e1'],
    hills:[{r:395,cols:[0xa9c4c0,0xb4cbc7],h:[80,140],n:12,rad:[.55,1]},{r:345,cols:[0x7fa596,0x8bb09f,0x76998a],h:[45,95],n:16,rad:[.55,1]}],
    gantryBg:'#7a1410', gantryFg:'#ffd36a',
    hemi:[0xfff6e6,0x86a060,.9], sun:[0xffe9c8,.8],
    cycle:42, split:[10,26]
  }
};
let currentMapId = 'classic';
const MAP = () => MAPS[currentMapId];
const biomeAt = n => { const m = MAP(), k = ((n % m.cycle) + m.cycle) % m.cycle; return k < m.split[0] ? 0 : k < m.split[1] ? 1 : 2; };

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true});
const PR_MAX = Math.min(window.devicePixelRatio||1, 2), PR_MIN = Math.min(PR_MAX, .75);
let pixelRatio = PR_MAX, needRender = true;
renderer.setPixelRatio(pixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 500);
let baseFov = 62, fovAdd = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false); needRender = true;
  camera.aspect = w/h;
  baseFov = camera.aspect < .8 ? 82 : camera.aspect < 1.2 ? 70 : 62;
}
window.addEventListener('resize', resize); resize();

const hemiL = new THREE.HemisphereLight(0xffffff, 0x5a7a4a, .8); scene.add(hemiL);
const sunL = new THREE.DirectionalLight(0xfff0c8, .7); sunL.position.set(-14, 34, 30); scene.add(sunL);

// sky (dibangun ulang per map)
let skyTex = null, skyMesh = null, sunMesh = null;
function buildSky(){
  if (skyMesh){ scene.remove(skyMesh); }
  if (sunMesh){ scene.remove(sunMesh); }
  const stops = MAP().skyStops;
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const x = c.getContext('2d'), g = x.createLinearGradient(0,0,0,512);
  if (currentMapId !== 'classic'){
    g.addColorStop(0,stops[0]); g.addColorStop(.28,stops[1]); g.addColorStop(.42,stops[2]);
    g.addColorStop(.5,stops[3]); g.addColorStop(1,stops[4]);
  } else {
    g.addColorStop(0,stops[0]); g.addColorStop(.3,stops[1]); g.addColorStop(.46,stops[2]);
    g.addColorStop(.5,stops[3]); g.addColorStop(.5,stops[4]); g.addColorStop(1,stops[4]);
  }
  x.fillStyle = g; x.fillRect(0,0,4,512);
  skyTex = new THREE.CanvasTexture(c);
  skyMesh = new THREE.Mesh(new THREE.SphereGeometry(440,16,12),
    new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide, fog:false}));
  scene.add(skyMesh);
  sunMesh = new THREE.Mesh(new THREE.CircleGeometry(currentMapId!=='classic'?19:15,40), new THREE.MeshBasicMaterial({color:0xfffbe0, fog:false}));
  sunMesh.position.set(-120, 170, -360); scene.add(sunMesh);
}

/* ---------- util material & mesh ---------- */
const BG = new THREE.BoxGeometry(1,1,1);
const matCache = {};
function clearMatCache(){ for (const k in matCache) delete matCache[k]; }
const M = (c, e) => { const k = c+'|'+(e||0); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({color:c, emissive:e||0})); };
const LM = c => { const k = 'f'+c; return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({color:c, flatShading:true})); };
function box(w,h,l,mat,x,y,z,parent){ const m = new THREE.Mesh(BG,mat); m.scale.set(w,h,l); m.position.set(x,y,z); (parent||scene).add(m); return m; }

// road
const ROAD_W = (HALF+.9)*2, TILE_L = ROAD_W/2;
let roadTex = null, road = null, lineM = null, railM = null, edgeLines = [], edgeRails = [];
const scrolls = [];
const addScroll = (m, span) => scrolls.push({m, span});
function buildRoad(){
  // clear old
  if (road){ scene.remove(road); road.material.map.dispose?.(); road.material.dispose?.(); }
  edgeLines.forEach(o=>scene.remove(o)); edgeRails.forEach(o=>scene.remove(o));
  for (const o of scrolls){ scene.remove(o.m); }
  scrolls.length = 0;
  edgeLines = []; edgeRails = [];

  const W = 1024, H = 512, RW = 256, RH = 128, ppu = W/ROAD_W, c = document.createElement('canvas'); c.width = RW; c.height = RH;
  const x = c.getContext('2d'); x.scale(RW/W, RH/H); const R = (a,b) => a + Math.random()*(b-a), ux = m => (m + ROAD_W/2)*ppu;
  const wrap = fn => { for (const oy of [-H,0,H]){ x.save(); x.translate(0,oy); fn(); x.restore(); } };
  x.fillStyle = '#2b2e35'; x.fillRect(0,0,W,H);

/* ---------- canvas textures & signs ---------- */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const signCache = {};
function signMat(text, bg, fg, border){
  const k = text+bg+fg; if (signCache[k]) return signCache[k];
  const tex = canvasTex(512, 128, (x, w, h) => {
    x.fillStyle = bg; x.fillRect(0,0,w,h);
    if (border){ x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(8,8,w-16,h-16); }
    const cjk = /[\u3400-\u9fff]/.test(text); x.fillStyle = fg; x.font = 'bold ' + Math.round(h*(cjk ? .7 : text.length > 12 ? .36 : .46)) + 'px Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",Helvetica,sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w/2, h/2 + 3);
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return signCache[k] = new THREE.MeshBasicMaterial({map:tex});
}

/* ---------- bake ---------- */
function bake(root){
  root.updateMatrixWorld(true);
  const buckets = new Map(), v = new THREE.Vector3(), nm = new THREE.Matrix3();
  root.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry, pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
    nm.getNormalMatrix(o.matrixWorld);
    const mats = Array.isArray(o.material) ? o.material : null;
    const ranges = mats ? geo.groups.map(gr => ({s:gr.start, c:gr.count, m:mats[gr.materialIndex]})) : [{s:0, c:pos.count, m:o.material}];
    for (const r of ranges){
      let b = buckets.get(r.m); if (!b) buckets.set(r.m, b = {p:[], n:[], u:[]});
      for (let i = r.s; i < r.s + r.c; i++){
        v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); b.p.push(v.x,v.y,v.z);
        v.fromBufferAttribute(nor,i).applyMatrix3(nm).normalize(); b.n.push(v.x,v.y,v.z);
        if (uv) b.u.push(uv.getX(i), uv.getY(i)); else b.u.push(0,0);
      }
    }
  });
  while (root.children.length) root.remove(root.children[0]);
  buckets.forEach((b, mat) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(b.p,3)); geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.n,3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.u,2));
    root.add(new THREE.Mesh(geo, mat));
  });
  return root;
}

/* ---------- chunk pool ---------- */
const pools = { classic:[[],[],[]], sahara:[[],[],[]], china:[[],[],[]] };
const chunks = []; let nextN = NCH;
for (let i = 0; i < NCH; i++){
  const g = new THREE.Group(); scene.add(g);
  const c = {g, gz:0, n:0, b:0, v:null, sign:false, announced:true, gantries:[0,1,2].map(makeGantry)};
  c.gantries.forEach(gt => { gt.position.z = -3; gt.visible = false; g.add(gt); });
  chunks.push(c);
}
function makePools(){
  for (const mapId of Object.keys(BUILDERS)){
    for (let b = 0; b < 3; b++){
      pools[mapId][b].forEach(p => { /* dispose old */ p.traverse(o => { if (o.isMesh){ o.geometry.dispose?.(); } }); });
      pools[mapId][b] = [];
      if (mapId !== currentMapId) continue;   // hanya peta aktif yang dibangun
      for (let i = 0; i < POOLN; i++){
        const g = new THREE.Group(); BUILDERS[mapId][b](g); g.userData.used = false;
        pools[mapId][b].push(bake(g));
      }
    }
  }
}
makePools();
function assignChunk(c, n){
  const b = biomeAt(n);
  if (c.v){ c.g.remove(c.v); c.v.userData.used = false; }
  const pool = pools[currentMapId][b];
  let v; do v = pick(pool); while (v.userData.used);
  v.userData.used = true; c.v = v; c.g.add(v);
  c.n = n; c.b = b; c.sign = n > 0 && b !== biomeAt(n-1); c.announced = !c.sign;
  c.gantries.forEach((gt,i) => {
    gt.visible = c.sign && i === b;
    if (gt.visible){
      // refresh sign material for current map
      const sg = gt.children.find(o=>o.isMesh && o.geometry && o.geometry.type==='PlaneGeometry' && o.material && o.material.map);
      if (sg) sg.material = signMat(MAP().biomeSigns[i],MAP().gantryBg,MAP().gantryFg,true);
    }
  });
}
function initWorld(){
  nextN = NCH;
  chunks.forEach((c,i) => { c.gz = 30 - i*SEGL; c.g.position.z = c.gz; assignChunk(c, i); c.announced = true; });
}
function updateChunks(s){
  for (const c of chunks){
    c.gz += s;
    if (c.gz - SEGL > 30){ c.gz -= NCH*SEGL; assignChunk(c, nextN++); }
    c.g.position.z = c.gz;
    if (!c.announced && c.gz - 3 > 6){ c.announced = true; if (mode === 'play') pop('Memasuki ' + MAP().biomeNames[c.b], '#ffffff'); }
  }
}

/* ---------- apply map ---------- */
function applyMap(){
  clearMatCache();
  buildFacades();
  // rebuild material-dependent items: road posts, rails, lines, ground, hills, sky
  buildSky();
  buildRoad();
  buildEnvironment();
  // gantry (gerbang penanda zona) dibangun ulang per peta
  chunks.forEach(c => {
    c.gantries.forEach(gt => c.g.remove(gt));
    c.gantries = [0,1,2].map(makeGantry);
    c.gantries.forEach(gt => { gt.position.z = -3; gt.visible = false; c.g.add(gt); });
  });
  // Rebuild pools because materials got reset
  makePools();
  initWorld();
  renderer.render(scene, camera);
}

const SHARED_GEO = new Set([tireGeo, shoulderGeo, barrelGeo, lipGeo, discGeo, bellGeo, hubGeo, hubRingGeo, coinGeo, ringGeo, wheelGeo, CYL, CONE4, CONE8, CONE3, TRI, SPH, HEMI, trunkGeo]);
function disposeItem(m){
  scene.remove(m);
  if (!m || !m.traverse) return;
  m.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry && !SHARED_GEO.has(o.geometry)) o.geometry.dispose?.();
    if (o.userData && o.userData.ownMat){ [].concat(o.material).forEach(mt => mt && mt.dispose?.()); }

}

/* ---------- spawn ---------- */
function spawn(L, z, d){
  const minG = lerp(68,42,d), maxG = lerp(150,88,d);
  const setGap = (extra=0) => { gap[L] = minG + Math.random()*(maxG-minG) + extra; };
  const limit = d > .55 ? LANES-1 : LANES-2;
  let blocked = 1;
  for (const o of items) if (o.lane !== L && (o.t==='car'||o.t==='barrier') && !o.fly && Math.abs(o.z - z) < 26) blocked++;
  let r = Math.random();
  if (blocked > limit && r < .78) r = .85;
  const x = laneX(L);
  if (r < .64){
    const c = randomCar(); c.g.position.set(x,0,z); scene.add(c.g);
    items.push({t:'car', m:c.g, lane:L, x, z, y:0, w:c.w, l:c.l, minDx:Infinity});
    setGap(c.l);
  } else if (r < .78){
    const b = makeBarrier(); b.g.position.set(x,0,z); scene.add(b.g);
    items.push({t:'barrier', m:b.g, lane:L, x, z, y:0, w:b.w, l:b.l, minDx:Infinity, blink:b.blink});
    setGap(b.l);
  } else if (r < .92){
    const n = 4 + ((Math.random()*5)|0);
    for (let i = 0; i < n; i++){
      const m = new THREE.Mesh(coinGeo, coinM); m.position.set(x,1.15,z - i*3.2); scene.add(m);
      items.push({t:'coin', m, lane:L, x, z:z - i*3.2, y:1.15, w:1, l:1});
    }
    setGap(n*3.2);
  } else {
    const kind = ['giant','nitro','fly'][(Math.random()*3)|0];
    const m = makePowerCoin(kind); m.position.set(x,1.4,z); scene.add(m);
    items.push({t:'power', kind, m, lane:L, x, z, y:1.4, w:1, l:1});
    setGap(10);
  }
}
function prefill(){
  for (let L = 0; L < LANES; L++){
    let z = -55 - Math.random()*25;
    while (z > -SPAWN+10){ spawn(L, z, 0); z -= gap[L]; }
    gap[L] = Math.max(0, -SPAWN - z);
  }
}

/* ---------- audio ---------- */
let ac = null, master, eng, engG, muted = false;
function initAudio(){
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
    eng = ac.createOscillator(); eng.type = 'sawtooth';
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 360;
    engG = ac.createGain(); engG.gain.value = 0;
    eng.connect(f); f.connect(engG); engG.connect(master); eng.start();
  } catch(e){ ac = null; }
}
function blip(f1, f2, d, type, v){
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d);
}
function noise(d, v){
  if (!ac) return; const n = ac.sampleRate*d, b = ac.createBuffer(1,n,ac.sampleRate), a = b.getChannelData(0);
  for (let i=0;i<n;i++) a[i] = (Math.random()*2-1) * (1-i/n);
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(master); s.start();
}

  const carCards = `<div class="scard ${carId === 'sport' ? 'sel' : ''}"><div class="cartile" style="color:${skinCss}">${SVG_SPORT}</div><b>Sport</b>
    <p class="cnote">Mobil bawaan.</p>${carBtn('sport', true, 0, '')}</div>
    <div class="scard ${carId === 'suv' ? 'sel' : ''}"><div class="cartile" style="color:${skinCss}">${SVG_SUV}</div><b>SUV Perisai</b>
    <p class="cnote">Bundling mobil + pasif Perisai: kebal 1x tabrakan, isi ulang tiap ${SHIELD_CD} detik.</p>${carBtn('suv', hasS, SUV_PRICE, 'buysuv')}</div>
    <div class="scard ${carId === 'f1' ? 'sel' : ''}"><div class="cartile" style="color:${skinCss}">${SVG_F1}</div><b>F1</b>
    <p class="cnote">Pasif: handling instan. Pindah jalur langsung responsif, tetap halus.</p>${carBtn('f1', hasRacer, F1_PRICE, 'buyf1')}</div>`;
  const mapCards = Object.values(MAPS).map(m => {
    const owned = hasMap(m.id), sel = currentMapId === m.id;
    const btn = sel ? '<button class="on" type="button" disabled>Dipakai</button>'
      : owned ? `<button class="use" type="button" data-act="usemap" data-id="${m.id}">Pakai</button>`
      : `<button class="${wallet < m.price ? 'poor' : ''}" type="button" data-act="buymap" data-id="${m.id}">Beli ${m.price}</button>`;
    const art = {classic:SVG_MAP_CLASSIC, sahara:SVG_MAP_SAHARA, china:SVG_MAP_CHINA}[m.id];
    const note = {classic:'Hutan, desa & pantai, kota metropolis.', sahara:'Gurun pasir, oasis & kasbah, lembah piramida.', china:'Sawah & bambu, kota lentera, pegunungan karst & Tembok Besar.'}[m.id];
    return `<div class="scard ${sel ? 'sel' : ''}"><div class="cartile">${art}</div><b>${m.name}</b>
      <p class="cnote">${note}</p>${btn}</div>`;
  }).join('');
  const cards = SKINS.map(k => {
    const css = '#' + k.hex.toString(16).padStart(6,'0');
    const has = owned.includes(k.id), sel = skinId === k.id;
    const btn = sel ? '<button class="on" type="button" disabled>Dipakai</button>'
      : has ? `<button class="use" type="button" data-act="use" data-id="${k.id}">Pakai</button>`
      : `<button class="${wallet < k.price ? 'poor' : ''}" type="button" data-act="buy" data-id="${k.id}">Beli ${k.price}</button>`;
    return `<div class="scard ${sel ? 'sel' : ''}"><div class="swatch" style="background:${css}"></div><b>${k.name}</b>${btn}</div>`;
  }).join('');
  const m = shopMsg; shopMsg = '';
  showCard(`<div class="sub"><h2>Shop</h2><div class="wallet"><i></i>${wallet}</div></div>
    <p style="margin-bottom:12px;font-size:14px;opacity:.85">Mobil, skin warna, dan peta. Kumpulkan koin di game untuk membelinya.</p>
    <div class="sgrid"><div class="sec">Mobil</div>${carCards}<div class="sec">Warna (dipakai di semua mobil)</div>${cards}<div class="sec">Peta</div>${mapCards}</div>
    <div class="msg">${m}</div>
    <div class="row" style="margin-top:8px"><button class="back" type="button" data-act="menu">Kembali</button></div>`, 'shop', true);
}

/* ---------- developer mode (rahasia) ---------- */
const DEV_CODE = 'uxadev'; let devBuf = '';
function enableDevMode(){
  SKINS.forEach(k => { if (!owned.includes(k.id)) owned.push(k.id); });
  ['suv','f1'].forEach(id => { if (!owned.includes(id)) owned.push(id); });
  Object.keys(MAPS).forEach(id => { if (!owned.includes('map_' + id)) owned.push('map_' + id); });
  saveStore();
  const old = document.getElementById('devpop'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'devpop';
  d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:9999;background:#12202e;color:#fff;border:2px solid #22e06a;border-radius:18px;padding:22px 34px;font:700 22px/1.2 system-ui,sans-serif;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6);opacity:0;transition:all .25s;pointer-events:none';
  d.textContent = 'Developer mode enabled';
  document.body.appendChild(d);
  requestAnimationFrame(() => { d.style.opacity = '1'; d.style.transform = 'translate(-50%,-50%) scale(1)'; });
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, 2200);
}
/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  const k = e.key;
  if (mode === 'pause'){ if (k === 'Escape' || k === 'p' || k === 'P' || k === 'Enter' || k === ' '){ e.preventDefault(); resumeGame(); } return; }
  if (!$('screen').classList.contains('hide') && screenKind === 'tutorial' && k.length === 1){
    devBuf = (devBuf + k.toLowerCase()).slice(-DEV_CODE.length);
    if (devBuf === DEV_CODE){ devBuf = ''; enableDevMode(); return; }
  }
  if (!$('screen').classList.contains('hide')){ if ((k === 'Enter' || k === ' ') && (screenKind === 'menu' || screenKind === 'over' || screenKind === 'tutorial')){ e.preventDefault(); start(); } return; }
  if (k === 'c' || k === 'C'){ toggleCam(); return; }
  if (k === 'Escape' || k === 'p' || k === 'P'){ pauseGame(); return; }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Shift'){ e.preventDefault(); activateNitro(); }
});
let fpv = false;
const cabin = new THREE.Group(); cabin.visible = false; scene.add(camera); camera.add(cabin);
const bm = c => new THREE.MeshBasicMaterial({color:c});
const DRV = .36;
const shell = new THREE.Group(); shell.position.x = -DRV; cabin.add(shell);
function cb(w,h,d,c,x,y,z,rx,rz,ry,p){ const m = new THREE.Mesh(BG,bm(c)); m.scale.set(w,h,d); m.position.set(x,y,z); if (rx) m.rotation.x = rx; if (rz) m.rotation.z = rz; if (ry) m.rotation.y = ry; (p||shell).add(m); return m; }
cb(2.0,.5,1.1,0x15151c, 0,-.78,-1.0);
cb(2.0,.06,.5,0x2a2a36, 0,-.52,-1.25);
cb(1.7,.06,2.6,0x1c2a3a, 0,-.82,-2.9, -.04);
cb(.12,1.3,.16,0x15151c, -.86,.0,-.95, 0,-.35);
cb(.12,1.3,.16,0x15151c,  .86,.0,-.95, 0, .35);
cb(2.0,.1,1.6,0x15151c, 0,.62,-.7);
cb(.5,.14,.04,0x0b0b10, 0,.4,-.9);
cb(.3,.2,.08,0x15151c, -1.0,-.35,-1.15);
cb(.3,.2,.08,0x15151c,  1.0,-.35,-1.15);
cb(.5,.14,.08,0x0b0b10, 0,-.44,-.7, -.3);
cb(.5,.16,.04,0x0b0b10, 0,-.5,-.8, -.5, 0, 0, cabin);
const wheelG = new THREE.Group(); wheelG.position.set(0,-.4,-.68); wheelG.rotation.x = -1.05; cabin.add(wheelG);
const wheelT = new THREE.Mesh(new THREE.TorusGeometry(.2,.032,6,16), bm(0x0b0b10)); wheelG.add(wheelT);
for (const a of [0, 2.1, 4.2]){ const sp = new THREE.Mesh(BG,bm(0x0b0b10)); sp.scale.set(.02,.19,.02); sp.position.set(Math.sin(a)*.1,Math.cos(a)*.1,0); sp.rotation.z = -a; wheelT.add(sp); }
function toggleCam(){ fpv = !fpv; $('camBtn').textContent = 'Kamera: ' + (fpv ? 'First Person' : 'Belakang'); }
$('camBtn').addEventListener('click', toggleCam);
let p0 = null;
window.addEventListener('pointerdown', e => { p0 = e.target.closest('button') ? null : {x:e.clientX, y:e.clientY, moved:false}; });
window.addEventListener('pointermove', e => {
  if (!p0) return; const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
  if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy)){ move(dx > 0 ? 1 : -1); p0.x = e.clientX; p0.y = e.clientY; p0.moved = true; }
});
window.addEventListener('pointerup', e => {
  if (!p0) return; const q = p0; p0 = null;
  if (q.moved || mode !== 'play') return;
  if (Math.abs(e.clientX-q.x) < 14 && Math.abs(e.clientY-q.y) < 14){
    const w = window.innerWidth; if (e.clientX < w*.35) move(-1); else if (e.clientX > w*.65) move(1);
  }
});
$('nbtn').addEventListener('click', activateNitro);

/* ---------- update ---------- */
function scrollWorld(dt){
  const s = speed*dt;
  roadTex.offset.y = (roadTex.offset.y + s/TILE_L) % 1;
  for (const o of scrolls){ o.m.position.z += s; while (o.m.position.z > 30) o.m.position.z -= o.span; }
  updateChunks(s);
}
function updateItems(dt){
  for (let i = items.length-1; i >= 0; i--){
    const it = items[i];
    it.z += (speed - laneSpeed[it.lane]) * dt;
    if (it.fly){ it.x += it.vx*dt; it.y += it.vy*dt; it.vy -= 32*dt; it.z += it.vz*dt; it.m.rotation.z += it.spin*dt; it.m.rotation.x += it.spin*.5*dt; }
    it.m.position.set(it.x, it.y, it.z);
    if (it.t === 'coin') it.m.rotation.y += 4*dt;
    else if (it.t === 'power'){ it.m.rotation.y += 3*dt; it.m.position.y = 1.4 + Math.sin(T*4)*.25; }
    else if (it.t === 'barrier') it.blink.visible = Math.floor(T*4)%2 === 0;

    if (mode === 'play' && !it.fly){
      const dx = it.x - px;
      if (it.t === 'coin' || it.t === 'power'){
        if ((flyH < 1.8 || (it.t === 'coin' && buff && buff.type === 'fly')) && Math.abs(it.z) < 2.0*gScale && Math.abs(dx) < 1.6*gScale){ collect(it); continue; }
      } else {
        const air = buff && buff.type === 'fly', big = buff && buff.type === 'giant';
        const hz = (it.l + 4.6*gScale)/2 - .3, hx = (it.w + 2.1*gScale)/2 - .2;
        if (Math.abs(it.z) < hz){
          if (Math.abs(dx) < hx){
            if (air){ }
            else if (big || nitroOn) smash(it);
            else if (invT > 0){ }
            else if (hasShield() && shieldCd <= 0) shieldBlock(it);
            else crash();
          }
          else it.minDx = Math.min(it.minDx, Math.abs(dx));
        } else if (it.z >= hz && !it.nm){
          it.nm = true; if (it.minDx < hx + .9 && !air && gScale < 1.5) nearMiss();
        }
      }
    }
    if (it.z > 14 || it.z < -270 || (it.fly && it.y < -2)){ disposeItem(it.m); items.splice(i,1); }
  }
}
function update(dt){
  T += dt;
  if (mode === 'menu'){ speed = 30; }
  else if (mode === 'play'){
    time += dt; const d = Math.min(1, time/120);
    let target = 38 + 42*(1 - Math.exp(-time/100));
    if (nitroOn){
      nitroT -= dt; nitroMeter = Math.max(0, nitroT/NITRO_DUR*100);
      if (nitroT <= 0){ nitroOn = false; nitroMeter = 0; }
      target *= 1.45;
    }
    if (invT > 0) invT -= dt;
    if (shieldCd > 0) shieldCd = Math.max(0, shieldCd - dt);
    if (shieldFlash > 0) shieldFlash -= dt;
    if (buff){ buff.t -= dt; if (buff.t <= 0) endBuff(); }
    speed += (target - speed) * Math.min(1, dt*(nitroOn ? 3 : 1.4));
    distance += speed*dt*.2;
    for (let L = 0; L < LANES; L++){ gap[L] -= (speed - laneSpeed[L])*dt; if (gap[L] <= 0) spawn(L, -SPAWN, d); }
  } else {
    speed = Math.max(0, speed - 70*dt); crashT += dt;
    if (crashT > 1.1 && !shown) gameOver();
  }
  scrollWorld(dt);
  updateItems(dt);

  const isGiant = !!(buff && buff.type === 'giant'), isFly = !!(buff && buff.type === 'fly');
  const tx = isGiant ? 0 : laneX(lane);
  gScale += ((isGiant ? GIANT_S : 1) - gScale) * (1 - Math.exp(-dt*5));
  flyH += ((isFly ? FLY_H : 0) - flyH) * (1 - Math.exp(-dt*3));
  if (isGiant && mode === 'play') shake = Math.max(shake, .1);
  let axRaw = 0;
  if (mode === 'crash'){
    yaw += spinV*dt; spinV *= Math.pow(.08, dt); px += slide*dt; slide *= Math.pow(.2, dt); px = clamp(px, -HALF+1, HALF-1);
    vx = slide; sx = px;
  } else {
    const isF1 = carId === 'f1' && hasF1();
    const sRate = isF1 ? 30 : 10, kS = isF1 ? 1600 : 240, cD = isF1 ? 2*Math.sqrt(kS)*1.02 : 30;
    sx += (tx - sx) * (1 - Math.exp(-dt*sRate));
    const pv = vx;
    vx += ((sx - px)*kS - vx*cD) * Math.min(dt, .033);
    px += vx*dt;
    axRaw = (vx - pv) / Math.max(dt, 1e-4);
  }
  ax += (axRaw - ax) * Math.min(1, dt*14);

  accL += (((speed - lastSpeed)/Math.max(dt,1e-4)) - accL) * Math.min(1, dt*6); lastSpeed = speed;
  const rollT  = mode === 'crash' ? 0 : clamp(ax*((carId === 'f1' && hasF1()) ? .00035 : .0012), -.1, .1);
  const pitchT = mode === 'crash' ? 0 : clamp(accL*.0012, -.05, .05) + Math.abs(ax)*.00006;
  const heaveT = -Math.abs(roll)*.3;
  rollV  += (-(roll  - rollT )*121 - rollV *7 ) * dt; roll  += rollV *dt;
  pitchV += (-(pitch - pitchT)*100 - pitchV*6 ) * dt; pitch += pitchV*dt;
  heaveV += (-(heave - heaveT)*196 - heaveV*11) * dt; heave += heaveV*dt;
  if (mode === 'play' && Math.random() < dt*3) heaveV += (Math.random()-.5)*.35;

  const py = heave + flyH + Math.sin(T*28)*.012 + (flyH > .5 ? Math.sin(T*2.2)*.15 : 0);
  player.position.set(px, py, 0);
  player.scale.setScalar(gScale);
  player.visible = !(fpv && mode !== 'menu') && (!(mode === 'play' && !buff && invT > 0) || ((T*10)|0) % 3 !== 0);
  const fk = 1 - flyH/FLY_H*.5;
  pShadow.position.y = (.02 - py)/gScale; pShadow.scale.set(pShadowBase.x*fk, pShadowBase.y, pShadowBase.z*fk); pShadow.material.opacity = .35*fk;
  player.rotation.x = pitch + flyH/FLY_H*.1;
  const yawK = (carId === 'f1' && hasF1()) ? .009 : .022;
  player.rotation.y = mode === 'crash' ? yaw : clamp(-vx*yawK, -.3, .3);
  player.rotation.z = roll;
  for (const f of flames){ f.visible = nitroOn || isFly; if (nitroOn || isFly){ f.scale.set(1,1,.7+Math.random()*.7); } }
  const ws = Math.min(speed, 26)*dt/(.4*gScale); for (const w of activeRig.spins) w.rotation.x -= ws;
  for (const p of activeRig.fronts) p.rotation.y = mode === 'crash' ? 0 : clamp(-vx*((carId === 'f1' && hasF1()) ? .012 : .03), -.4, .4);

  shake = Math.max(0, shake - dt*1.6);
  fovAdd += ((nitroOn ? 10 : 0) - fovAdd) * Math.min(1, dt*4);
  cabin.visible = fpv && mode !== 'menu' && carId !== 'f1'; camera.near = cabin.visible ? .1 : .5;
  camera.fov = baseFov + fovAdd; camera.updateProjectionMatrix();
  if (mode === 'menu'){
    camera.position.set(Math.sin(T*.35)*2.5, 4.6, 10.4); camera.lookAt(0,1.3,-16);
  } else {
    camX += (px - camX) * (1 - Math.exp(-dt*((carId === 'f1' && hasF1()) ? 11 : 6)));
    const g1 = gScale - 1;
    if (fpv){
      const eyeY = player.position.y - heave + eyeH*gScale + .02*gScale;
      const ex = px + (carId === 'f1' ? 0 : DRV)*gScale;
      camera.position.set(ex, eyeY + (Math.random()-.5)*shake*.1, .42*gScale);
      camera.lookAt(ex, eyeY - .12*gScale, -40);
      cabin.scale.setScalar(gScale);
      wheelT.rotation.z = -vx*.12;
    } else {
      camera.position.set(camX + (Math.random()-.5)*shake*.8, 5.2 + g1*2.3 + flyH*.55 + heave*.5 + (Math.random()-.5)*shake*.8, 9.6 + g1*4.6);
      camera.lookAt((camX + px)*.5, 1.2 + flyH*.3 + g1*.5, -16);
    }
  }
  skyMesh.position.copy(camera.position);

  $('sc').textContent = score(); $('cn').textContent = coins; $('kmh').textContent = Math.round(speed*3);
  $('nfill').style.width = nitroMeter + '%';
  $('pausebtn').classList.toggle('on', mode === 'play');
  const bh = $('buffhud');
  if (buff && mode === 'play'){
    const bd = BUFFS.find(q => q.id === buff.type);
    bh.classList.add('on'); $('bname').textContent = bd.name + ' ' + Math.ceil(buff.t) + 's'; $('bname').style.color = bd.color;
    $('bfill').style.width = (buff.t/buff.dur*100) + '%'; $('bfill').style.background = bd.color;
  } else {
    bh.classList.remove('on');
  }
  const sh = $('shieldhud');
  if (hasShield() && mode === 'play'){
    sh.classList.add('on'); const rdy = shieldCd <= 0; sh.classList.toggle('cd', !rdy);
    sh.textContent = rdy ? 'Perisai siap' : 'Perisai ' + Math.ceil(shieldCd) + 's';
  } else sh.classList.remove('on');
  const ready = nitroMeter >= 100 && !nitroOn;
  $('nbtn').classList.toggle('ready', ready);
  $('nlabel').textContent = nitroOn ? 'Nitro aktif!' : ready ? 'Nitro siap! Tekan Spasi' : 'Nitro';
  $('nitroFx').style.opacity = nitroOn ? 1 : 0;

  if (ac){
    eng.frequency.setTargetAtTime(48 + speed*1.7, ac.currentTime, .1);
    engG.gain.setTargetAtTime(mode === 'play' ? .06 : 0, ac.currentTime, .15);
  }
}

/* ---------- culling & adaptive res ---------- */
const CULL_BEHIND = 3, CULL_FAR = 345;
function cullView(){
  const cz = camera.position.z;
  for (const c of chunks){
    c.g.visible = (c.gz - SEGL < cz + CULL_BEHIND) && (c.gz > cz - CULL_FAR);
  }
  for (const o of scrolls){ const z = o.m.position.z; o.m.visible = z < cz + CULL_BEHIND && z > cz - CULL_FAR; }
  for (const it of items){ const z = it.z; it.m.visible = z < cz + CULL_BEHIND + 2 && z > cz - CULL_FAR; }
}
let ftAvg = 16, ftN = 0, ftCool = 0;
function adaptRes(dtMs){
  ftAvg += (dtMs - ftAvg) * .08;
  if (++ftN < 45 || ftCool-- > 0) return;
  if (ftAvg > 24 && pixelRatio > PR_MIN){ pixelRatio = Math.max(PR_MIN, pixelRatio - .25); resize(); ftCool = 60; ftN = 0; }
  else if (ftAvg < 13 && pixelRatio < PR_MAX){ pixelRatio = Math.min(PR_MAX, pixelRatio + .25); resize(); ftCool = 240; ftN = 0; }
}

let last = performance.now(), prevFrozen = false;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt = now - last, dt = Math.min(.05, rawDt/1000); last = now;
  const frozen = mode === 'pause' || mode === 'choose';
  if (!frozen) update(dt);
  if (frozen && prevFrozen && !needRender) return;
  prevFrozen = frozen; needRender = false;
  cullView();
  renderer.render(scene, camera);
  if (!frozen && rawDt < 200) adaptRes(rawDt);
}
menu();
requestAnimationFrame(frame);
})();
</script>
